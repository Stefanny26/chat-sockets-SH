<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login - Web Chat</title>
  <link rel="stylesheet" href="css/register.css" />
</head>
<body>
  <div class="login-container">
    <h2>Bienvenido al Chat</h2>
    <input type="text" id="username" placeholder="Ingresa tu nombre de usuario" />
    <button id="login">Ingresar</button>
  </div>

  <script>
    const login = document.querySelector("#login");
    login.addEventListener("click", () => {
      try {
        const user = document.querySelector("#username").value.trim();
        // Validación: no vacío y solo letras, números y guiones bajos
        if (user && /^[a-zA-Z0-9_]+$/.test(user)) {
          document.cookie = `username=${user}; path=/`;
          document.location.href = "/";
        } else {
          alert("Por favor ingresa un nombre de usuario válido (solo letras, números y guiones bajos)");
        }
      } catch (err) {
        alert("Ocurrió un error inesperado al registrar el usuario.");
        console.error("Error en registro:", err);
      }
    });
  </script>
</body>
</html>
