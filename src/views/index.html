<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Web Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/Chat.css" />
</head>
<body>
  <header>
    Web Chat - Bienvenido, <span id="nombre-usuario"></span>
    <button id="logout" class="btn-logout">Cerrar sesión</button>
  </header>

  <main class="container">
    <div id="all-messages"></div>
    <div class="send-message">
      <input type="text" id="message" placeholder="Escribe un mensaje..." />
      <button type="button" id="send-message">➤</button>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/script.js"></script>
  <script>
  // Mostrar el nombre de usuario
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
  const username = getCookie('username');
  document.getElementById('nombre-usuario').textContent = username || 'Anónimo';

  // Cerrar sesión
  document.getElementById('logout').addEventListener('click', () => {
    document.cookie = "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    window.location.href = "/register";
  });

  // Manejo de errores de Socket.IO
  const socket = io();
  socket.on("error", (msg) => {
    alert("Error: " + msg);
  });
</script>
</body>
</html>
