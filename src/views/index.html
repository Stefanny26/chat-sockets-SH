<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Web Chat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/Chat.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(";").shift());
    return null;
  }

  // Si no hay cookie, redirigir a la página de registro
  if (!getCookie("username")) {
    window.location.href = "/register.html";
  }
</script>

<body>
  <header class="d-flex justify-content-between align-items-center px-4 py-2  text-white">
    <div>Web Chat - Bienvenido, <span id="nombre-usuario"></span></div>
    <button id="logout" class="btn-logout" title="Cerrar sesión">
      <i class="fas fa-sign-out-alt"></i>
    </button>
  </header>

  <main class="container-fluid p-0">
    <div class="row g-0" style="height: 90vh;">
      <!-- Columna izquierda: usuarios -->
      <div class="col-md-3 border-end bg-light user-sidebar">
        <div id="user-list" class="user-list">
          <h6 class="p-3 mb-0">Usuarios conectados:</h6>
          <ul class="list-group list-group-flush" id="users"></ul>
        </div>
      </div>

      <!-- Columna derecha: chat -->
      <div class="col-md-9 d-flex flex-column">
        <div id="all-messages" class="flex-grow-1 p-3 overflow-auto" aria-live="polite" aria-relevant="additions">
          <!-- Aquí van los mensajes -->
        </div>
        <div class="send-message input-group p-3">
          <input type="text" id="message" class="form-control" placeholder="Escribe un mensaje..."
            aria-label="Mensaje" />
          <button class="btn btn-primary" type="button" id="send-message">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </main>


  <script src="/socket.io/socket.io.js"></script>
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
